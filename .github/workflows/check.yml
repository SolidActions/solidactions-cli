name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      examples_ref:
        description: solidactions-examples release-candidate ref
        required: true
        default: main
      sdk_ref:
        description: solidactions-ts-sdk release-candidate ref
        required: true
        default: main

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: cli
      - uses: actions/checkout@v6
        with:
          repository: SolidActions/solidactions-examples
          ref: ${{ inputs.examples_ref || 'main' }}
          path: examples
      - uses: actions/checkout@v6
        with:
          repository: SolidActions/solidactions-ts-sdk
          ref: ${{ inputs.sdk_ref || 'main' }}
          path: ts-sdk
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: cli
      # smoke:init SKIPs (exit 0) when the sibling checkouts are missing, which
      # keeps `check:release` usable on a clean local clone. That must never be
      # able to false-green the release gate here, where the checkouts are
      # cloned above and are always expected: make a missing one a hard failure.
      - run: npm run check:release
        working-directory: cli
        env:
          SOLIDACTIONS_SMOKE_REQUIRE_SOURCES: '1'
          SOLIDACTIONS_EXAMPLES_DIR: ${{ github.workspace }}/examples
          SOLIDACTIONS_SDK_DIR: ${{ github.workspace }}/ts-sdk
      - run: npm audit --omit=dev --audit-level=high
        working-directory: cli

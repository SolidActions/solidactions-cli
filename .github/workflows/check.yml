name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      examples_ref:
        description: solidactions-examples release-candidate ref
        required: true
        default: main
      sdk_ref:
        description: solidactions-ts-sdk release-candidate ref
        required: true
        default: main

jobs:
  native-database-client:
    name: Native database client (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - '20'
          - '24'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node scripts/probe-native-database-client.mjs

  database-client-remote-sync:
    name: Database client remote sync
    runs-on: ubuntu-latest
    services:
      database:
        image: ghcr.io/tursodatabase/libsql-server:3ec6803@sha256:1bc51611928ccc51229bdc40ca0defcb915907f8f9f6a664b43529de0ca45fab
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Wait for the database service
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Database service did not become ready in 30 seconds." >&2
          exit 1
      - run: node scripts/probe-database-client-sync.mjs
        env:
          SOLIDACTIONS_DATABASE_SYNC_URL: http://127.0.0.1:8080

  release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: cli
      - uses: actions/checkout@v6
        with:
          repository: SolidActions/solidactions-examples
          ref: ${{ inputs.examples_ref || 'main' }}
          path: examples
      - uses: actions/checkout@v6
        with:
          repository: SolidActions/solidactions-ts-sdk
          ref: ${{ inputs.sdk_ref || 'main' }}
          path: ts-sdk
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: cli
      # smoke:init SKIPs (exit 0) when the sibling checkouts are missing, which
      # keeps `check:release` usable on a clean local clone. That must never be
      # able to false-green the release gate here, where the checkouts are
      # cloned above and are always expected: make a missing one a hard failure.
      - run: npm run check:release
        working-directory: cli
        env:
          SOLIDACTIONS_SMOKE_REQUIRE_SOURCES: '1'
          SOLIDACTIONS_EXAMPLES_DIR: ${{ github.workspace }}/examples
          SOLIDACTIONS_SDK_DIR: ${{ github.workspace }}/ts-sdk
      - run: npm audit --omit=dev --audit-level=high
        working-directory: cli
